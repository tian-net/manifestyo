apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
  namespace: freddy-quispe-12-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017